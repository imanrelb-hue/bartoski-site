<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bartoski Engenharia</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Bartoski Engenharia.">
<style>
  :root{
    --gold:#D0A830; --green:#14372B;
    --paper:#F4F5F1; --ink:#16201B; --muted:#5C6960;
    --roman:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
    --sans:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
    --gutter:clamp(1.4rem,5vw,5rem);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --gold:#E0BE55; --paper:#0C120F; --ink:#E4E8E1; --muted:#8E9C92;
    }
  }
  :root[data-theme="dark"]{
    --gold:#E0BE55; --paper:#0C120F; --ink:#E4E8E1; --muted:#8E9C92;
  }
  :root[data-theme="light"]{
    --gold:#D0A830; --paper:#F4F5F1; --ink:#16201B; --muted:#5C6960;
  }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }

  main{
    width:100%;
    max-width:46rem;
    margin-inline:auto;
    padding:clamp(2rem,8vw,4rem) var(--gutter);
  }

  .wordmark{ display:block; line-height:.92 }
  .wordmark span{
    font-family:var(--roman);
    font-weight:400;
    text-transform:uppercase;
    display:block;
    letter-spacing:.035em;
    font-size:clamp(1.9rem,5.2vw,3.1rem);
  }
  .wordmark .a{ color:var(--gold) }
  .wordmark .b{ color:var(--ink) }

  .aviso{
    margin-top:clamp(2.5rem,7vw,4rem);
    font-family:var(--roman);
    font-size:clamp(1.15rem,2.6vw,1.5rem);
    line-height:1.5;
    color:var(--ink);
    max-width:32ch;
  }
  .nota{
    margin-top:1.1rem;
    font-size:.95rem;
    line-height:1.6;
    color:var(--muted);
    max-width:44ch;
  }
</style>
</head>
<body>
  <main>
    <p class="wordmark">
      <span class="a">Bartoski</span>
      <span class="b">Engenharia</span>
    </p>

    <p class="aviso">Site em manutenção.</p>
    <p class="nota">Estamos revisando o conteúdo. Voltamos em breve.</p>
  </main>
</body>
</html>
